name: Build AdoptIQ

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.3)"
        required: false
        default: "1.0.3"
      build_number:
        description: "Build number"
        required: false
        default: "1"
  push:
    tags:
      - "v*"

env:
  ADOPTIQ_VERSION: ${{ github.event.inputs.version || '1.0.3' }}
  ADOPTIQ_BUILD: ${{ github.event.inputs.build_number || '1' }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Round 63 / Tier A: dev-only quality tools are NOT in
          # requirements.txt (per the local-only convention). Install
          # them here so `make verify` runs lint + security + audit
          # in CI the same way it does locally.
          pip install ruff bandit pip-audit

      - name: Run quality gate (lint + security + audit + tests)
        run: make verify

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: quality-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create secrets.env
        run: |
          if [ -z "${SECRETS_ENV_FILE:-}" ]; then
            echo "::error::SECRETS_ENV_FILE is not configured"
            exit 1
          fi
          printf "%s" "$SECRETS_ENV_FILE" > secrets.env
        env:
          SECRETS_ENV_FILE: ${{ secrets.SECRETS_ENV_FILE }}

      - name: Embed credentials
        run: python embed_credentials.py

      - name: Build app bundle and DMG
        run: |
          chmod +x build_mac.sh build_mac_dmg.sh
          bash build_mac_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AdoptIQ-macOS-v${{ env.ADOPTIQ_VERSION }}-build${{ env.ADOPTIQ_BUILD }}
          path: OUTBOX/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: quality-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create secrets.env
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SECRETS_ENV_FILE)) {
            Write-Error "SECRETS_ENV_FILE is not configured"
            exit 1
          }
          # Write UTF-8 WITHOUT BOM. Set-Content -Encoding UTF8 on PS 5.1 emits a
          # BOM, which used to cause embed_credentials.py to silently drop the
          # first key. embed_credentials.py is now BOM-safe (utf-8-sig), but we
          # still write a clean BOM-free file here for hygiene.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("secrets.env", $env:SECRETS_ENV_FILE, $utf8NoBom)
        env:
          SECRETS_ENV_FILE: ${{ secrets.SECRETS_ENV_FILE }}

      - name: Embed credentials
        run: python embed_credentials.py

      - name: Update version metadata
        run: python update_version_pc.py
        env:
          ADOPTIQ_VERSION: ${{ env.ADOPTIQ_VERSION }}
          ADOPTIQ_BUILD: ${{ env.ADOPTIQ_BUILD }}

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean --noconfirm adoptiq_pc.spec

      - name: Package OUTBOX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OUTBOX | Out-Null
          Copy-Item dist\AdoptIQ.exe OUTBOX\
          Copy-Item Run_AdoptIQ.bat OUTBOX\
          Copy-Item Unblock_AdoptIQ.bat OUTBOX\
          Copy-Item scripts\win\READ_ME_FIRST.txt OUTBOX\
          Copy-Item README.md OUTBOX\
          "AdoptIQ v${{ env.ADOPTIQ_VERSION }} build ${{ env.ADOPTIQ_BUILD }}" | Set-Content OUTBOX\build_info.txt
          "Built: $(Get-Date)" | Add-Content OUTBOX\build_info.txt
          Get-ChildItem -Path OUTBOX -File | Unblock-File -ErrorAction SilentlyContinue

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AdoptIQ-Windows-v${{ env.ADOPTIQ_VERSION }}-build${{ env.ADOPTIQ_BUILD }}
          path: |
            OUTBOX/AdoptIQ.exe
            OUTBOX/Run_AdoptIQ.bat
            OUTBOX/Unblock_AdoptIQ.bat
            OUTBOX/READ_ME_FIRST.txt
            OUTBOX/README.md
            OUTBOX/build_info.txt
          if-no-files-found: error
