name: Build AdoptIQ

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.4); leave blank to use config.py SSoT"
        required: false
        default: ""
      build_number:
        description: "Build number; leave blank to use config.py SSoT"
        required: false
        default: ""
      developer_only:
        description: "Build credential-free developer candidates"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

# Round 71 / Phase 1 (#4): the previous version defaults
# (``ADOPTIQ_VERSION='1.0.3'`` / ``ADOPTIQ_BUILD='1'``) silently
# overrode the ``config.py`` SSoT every CI run -- so a 1.0.4/45 build
# would have shipped DMGs / artifact names labeled ``v1.0.3-build1``.
# Leave the env empty when the operator did not pass an explicit input;
# ``update_version_pc.py`` will then preserve whatever ``config.py``
# already declares (it only rewrites when both env vars are non-empty).
env:
  ADOPTIQ_VERSION: ${{ github.event.inputs.version || '' }}
  ADOPTIQ_BUILD: ${{ github.event.inputs.build_number || '' }}
  ADOPTIQ_DEVELOPER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.developer_only && '1' || '0' }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Round 63 / Tier A: dev-only quality tools are NOT in
          # requirements.txt (per the local-only convention). Install
          # them here so `make verify` runs lint + security + audit
          # in CI the same way it does locally.
          pip install ruff bandit pip-audit

      - name: Run quality gate (lint + security + audit + tests)
        run: make verify

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: quality-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create secrets.env
        if: env.ADOPTIQ_DEVELOPER_ONLY != '1'
        run: |
          if [ -z "${SECRETS_ENV_FILE:-}" ]; then
            echo "::error::SECRETS_ENV_FILE is not configured"
            exit 1
          fi
          printf "%s" "$SECRETS_ENV_FILE" > secrets.env
        env:
          SECRETS_ENV_FILE: ${{ secrets.SECRETS_ENV_FILE }}

      - name: Embed credentials
        if: env.ADOPTIQ_DEVELOPER_ONLY != '1'
        run: python embed_credentials.py

      - name: Build app bundle and DMG
        run: |
          chmod +x build_mac.sh build_mac_dmg.sh
          bash build_mac_dmg.sh

      - name: Verify developer-only macOS candidate
        if: env.ADOPTIQ_DEVELOPER_ONLY == '1'
        run: |
          DMG_PATH=$(find developer_candidates -maxdepth 1 -type f -name 'AdoptIQ-v*.dmg' -print -quit)
          test -n "$DMG_PATH"
          python scripts/verify_developer_candidate.py \
            --app developer_candidates/AdoptIQ.app \
            --dmg "$DMG_PATH" \
            --summary developer_candidates/developer_candidate_verification.json

      # Round 71 / Phase 1 (#4): read the resolved version + build out
      # of config.py SSoT (post-build) so the artifact name reflects
      # whatever the build actually shipped, regardless of whether the
      # operator passed explicit env inputs.
      - name: Resolve build label
        id: label
        run: |
          VERSION=$(python -c "import re; print(re.search(r'ADOPTIQ_VERSION\s*=\s*\"([^\"]+)\"', open('config.py').read()).group(1))")
          BUILD=$(python -c "import re; print(re.search(r'ADOPTIQ_BUILD\s*=\s*\"([^\"]+)\"', open('config.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AdoptIQ-macOS-v${{ steps.label.outputs.version }}-build${{ steps.label.outputs.build }}-${{ env.ADOPTIQ_DEVELOPER_ONLY == '1' && 'developer' || 'release' }}
          path: |
            OUTBOX/*.dmg
            developer_candidates/*.dmg
            developer_candidates/*verification.json
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: quality-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create secrets.env
        if: env.ADOPTIQ_DEVELOPER_ONLY != '1'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SECRETS_ENV_FILE)) {
            Write-Error "SECRETS_ENV_FILE is not configured"
            exit 1
          }
          # Write UTF-8 WITHOUT BOM. Set-Content -Encoding UTF8 on PS 5.1 emits a
          # BOM, which used to cause embed_credentials.py to silently drop the
          # first key. embed_credentials.py is now BOM-safe (utf-8-sig), but we
          # still write a clean BOM-free file here for hygiene.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("secrets.env", $env:SECRETS_ENV_FILE, $utf8NoBom)
        env:
          SECRETS_ENV_FILE: ${{ secrets.SECRETS_ENV_FILE }}

      - name: Embed credentials
        if: env.ADOPTIQ_DEVELOPER_ONLY != '1'
        run: python embed_credentials.py

      - name: Update version metadata
        run: python update_version_pc.py
        env:
          ADOPTIQ_VERSION: ${{ env.ADOPTIQ_VERSION }}
          ADOPTIQ_BUILD: ${{ env.ADOPTIQ_BUILD }}

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean --noconfirm adoptiq_pc.spec

      - name: Verify developer-only Windows candidate
        if: env.ADOPTIQ_DEVELOPER_ONLY == '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OUTBOX | Out-Null
          python scripts\verify_windows_developer_candidate.py `
            --exe dist\AdoptIQ.exe `
            --summary OUTBOX\windows_developer_candidate_verification.json

      - name: Smoke developer-only Windows candidate
        if: env.ADOPTIQ_DEVELOPER_ONLY == '1'
        shell: pwsh
        run: |
          $env:ADOPTIQ_PORT = "61469"
          $env:ADOPTIQ_BIND_HOST = "127.0.0.1"
          $env:ADOPTIQ_LAUNCHER_SPLASH_SHOWN = "1"
          $env:ADOPTIQ_SECRET_KEY = "github-actions-developer-smoke-main-key-000000000000000000000000"
          $env:ADOPTIQ_ADMIN_SECRET_KEY = "github-actions-developer-smoke-admin-key-00000000000000000000"
          $process = Start-Process -FilePath "dist\AdoptIQ.exe" -PassThru
          $ready = $false
          try {
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:61469/ping" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq "OK") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) {
              throw "Packaged Windows candidate did not become ready on loopback."
            }
            $version = Invoke-RestMethod -Uri "http://127.0.0.1:61469/api/version" -TimeoutSec 5
            if (-not $version.ok -or -not $version.frozen) {
              throw "Packaged Windows candidate did not report frozen version metadata."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      # Round 71 / Phase 1 (#4): same SSoT-from-config.py read as the
      # macOS lane (the env vars may be empty if the operator did not
      # pass explicit inputs; update_version_pc.py preserved config.py
      # in that case).
      - name: Resolve build label
        id: label
        shell: pwsh
        run: |
          $cfg = Get-Content config.py -Raw
          $version = ($cfg | Select-String -Pattern 'ADOPTIQ_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $build = ($cfg | Select-String -Pattern 'ADOPTIQ_BUILD\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package OUTBOX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OUTBOX | Out-Null
          Copy-Item dist\AdoptIQ.exe OUTBOX\
          Copy-Item Run_AdoptIQ.bat OUTBOX\
          Copy-Item Unblock_AdoptIQ.bat OUTBOX\
          Copy-Item scripts\win\READ_ME_FIRST.txt OUTBOX\
          Copy-Item README.md OUTBOX\
          "AdoptIQ v${{ steps.label.outputs.version }} build ${{ steps.label.outputs.build }}" | Set-Content OUTBOX\build_info.txt
          "Built: $(Get-Date)" | Add-Content OUTBOX\build_info.txt
          Get-ChildItem -Path OUTBOX -File | Unblock-File -ErrorAction SilentlyContinue

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AdoptIQ-Windows-v${{ steps.label.outputs.version }}-build${{ steps.label.outputs.build }}-${{ env.ADOPTIQ_DEVELOPER_ONLY == '1' && 'developer' || 'release' }}
          path: |
            OUTBOX/AdoptIQ.exe
            OUTBOX/Run_AdoptIQ.bat
            OUTBOX/Unblock_AdoptIQ.bat
            OUTBOX/READ_ME_FIRST.txt
            OUTBOX/README.md
            OUTBOX/build_info.txt
            OUTBOX/windows_developer_candidate_verification.json
          if-no-files-found: error
