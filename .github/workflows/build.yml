name: Build AdoptIQ Developer Candidates

on:
  # Round 169.4: PR CI uses this file because it is the last workflow that
  # actually received a GitHub-hosted runner (Quality Checks, 2026-08-04).
  # Standalone offline-sim.yml pull_request jobs never started (runner_id=0).
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.4); leave blank to use config.py SSoT"
        required: false
        default: ""
      build_number:
        description: "Build number; leave blank to use config.py SSoT"
        required: false
        default: ""
      developer_only:
        description: "Build credential-free developer candidates"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

# Round 71 / Phase 1 (#4): the previous version defaults
# (``ADOPTIQ_VERSION='1.0.3'`` / ``ADOPTIQ_BUILD='1'``) silently
# overrode the ``config.py`` SSoT every CI run -- so a 1.0.4/45 build
# would have shipped DMGs / artifact names labeled ``v1.0.3-build1``.
# Leave the env empty when the operator did not pass an explicit input;
# ``update_version_pc.py`` will then preserve whatever ``config.py``
# already declares (it only rewrites when both env vars are non-empty).
env:
  ADOPTIQ_VERSION: ${{ github.event.inputs.version || '' }}
  ADOPTIQ_BUILD: ${{ github.event.inputs.build_number || '' }}
  ADOPTIQ_DEVELOPER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.developer_only == true && '1' || '0' }}

permissions:
  contents: read

jobs:
  developer-candidate-policy:
    name: Enforce developer-candidate-only workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # This job intentionally runs before checkout, dependency installation,
      # or any build command. Hosted Actions is a credential-free developer
      # candidate lane only; production release packaging remains an explicitly
      # approved, credential-gated operation on an authorized local machine.
      - name: Reject release-mode or tag invocation
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] \
              || [[ "$GITHUB_REF_TYPE" == "tag" ]] \
              || [[ "$ADOPTIQ_DEVELOPER_ONLY" != "1" ]]; then
            echo "::error::This hosted workflow only builds developer candidates; tags and developer_only=false are prohibited."
            exit 1
          fi

  quality-checks:
    name: Quality Checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: developer-candidate-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Round 63 / Tier A: dev-only quality tools are NOT in
          # requirements.txt (per the local-only convention). Install
          # them here so `make verify` runs lint + security + audit
          # in CI the same way it does locally.
          pip install ruff bandit pip-audit

      - name: Run quality gate (lint + security + audit + tests)
        run: make verify

      # Round 168: hosted CI runs a guarded developer-candidate fixture lane:
      # real fetcher SQL against the fail-closed Snowflake simulator,
      # all report selections, two independent managers plus aggregate scope,
      # degraded sources, artifact completeness/links, Ask AI, and workspace.
      # It is deliberately not labeled production or release validation because
      # hosted runners do not have an operator-owned real-shape CSOne corpus.
      - name: Run developer-candidate fixture simulation
        run: |
          python scripts/run_round146_acceptance.py \
            --output-dir .adoptiq-acceptance/developer-candidate-fixture-simulation \
            local \
            --days 90

  build-mac:
    name: Build macOS developer candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: quality-checks
    env:
      ADOPTIQ_DEVELOPER_ONLY: "1"
      ADOPTIQ_RELEASE_GATE: "0"
      ADOPTIQ_BAKE_CORPUS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Assert non-release macOS build invariant
        run: |
          test "$ADOPTIQ_DEVELOPER_ONLY" = "1"
          test "$ADOPTIQ_RELEASE_GATE" = "0"

      - name: Build developer-only app bundle and DMG
        run: |
          chmod +x build_mac.sh build_mac_dmg.sh
          bash build_mac_dmg.sh

      # Resolve identity before verification so every gate compares against
      # config.py rather than trusting the artifact filename.
      - name: Resolve build label
        id: label
        run: |
          VERSION=$(python -c "import re; print(re.search(r'ADOPTIQ_VERSION\s*=\s*\"([^\"]+)\"', open('config.py').read()).group(1))")
          BUILD=$(python -c "import re; print(re.search(r'ADOPTIQ_BUILD\s*=\s*\"([^\"]+)\"', open('config.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Verify developer-only macOS candidate
        run: |
          DMG_PATH=$(find developer_candidates -maxdepth 1 -type f -name 'AdoptIQ-v*.dmg' -print -quit)
          test -n "$DMG_PATH"
          python scripts/verify_developer_candidate.py \
            --app developer_candidates/AdoptIQ.app \
            --dmg "$DMG_PATH" \
            --expected-version "${{ steps.label.outputs.version }}" \
            --expected-build "${{ steps.label.outputs.build }}" \
            --expected-commit "$GITHUB_SHA" \
            --summary developer_candidates/developer_candidate_verification.json

      - name: Smoke developer-only macOS app
        run: |
          python scripts/smoke_frozen_candidate.py \
            --candidate developer_candidates/AdoptIQ.app \
            --expected-version "${{ steps.label.outputs.version }}" \
            --expected-build "${{ steps.label.outputs.build }}" \
            --summary developer_candidates/mac_developer_candidate_smoke.json

      - name: Stage checksummed macOS developer candidate
        run: |
          DMG_PATH=$(find developer_candidates -maxdepth 1 -type f -name 'AdoptIQ-v*.dmg' -print -quit)
          python scripts/candidate_provenance.py stage \
            --stage-dir native_candidate_stage/macos \
            --platform macos \
            --version "${{ steps.label.outputs.version }}" \
            --build "${{ steps.label.outputs.build }}" \
            --commit "$GITHUB_SHA" \
            --file "$DMG_PATH" \
            --file developer_candidates/README.md \
            --file developer_candidates/build_info.txt \
            --file developer_candidates/developer_candidate_verification.json \
            --file developer_candidates/mac_developer_candidate_smoke.json

      - name: Upload macOS developer candidate
        uses: actions/upload-artifact@v4
        with:
          name: AdoptIQ-macOS-v${{ steps.label.outputs.version }}-build${{ steps.label.outputs.build }}-developer
          path: native_candidate_stage/macos/*
          if-no-files-found: error

      - name: Download uploaded macOS developer candidate
        uses: actions/download-artifact@v4
        with:
          name: AdoptIQ-macOS-v${{ steps.label.outputs.version }}-build${{ steps.label.outputs.build }}-developer
          path: ${{ runner.temp }}/downloaded-macos-candidate

      - name: Re-verify downloaded macOS developer candidate
        run: |
          DOWNLOADED="$RUNNER_TEMP/downloaded-macos-candidate"
          python scripts/candidate_provenance.py verify \
            --stage-dir "$DOWNLOADED" \
            --platform macos \
            --version "${{ steps.label.outputs.version }}" \
            --build "${{ steps.label.outputs.build }}" \
            --commit "$GITHUB_SHA"
          DMG_PATH=$(find "$DOWNLOADED" -maxdepth 1 -type f -name 'AdoptIQ-v*.dmg' -print -quit)
          test -n "$DMG_PATH"
          python scripts/verify_developer_candidate.py \
            --skip-loose-app \
            --dmg "$DMG_PATH" \
            --expected-version "${{ steps.label.outputs.version }}" \
            --expected-build "${{ steps.label.outputs.build }}" \
            --expected-commit "$GITHUB_SHA" \
            --summary "$RUNNER_TEMP/downloaded_macos_candidate_verification.json"
          python scripts/smoke_frozen_candidate.py \
            --candidate "$DMG_PATH" \
            --expected-version "${{ steps.label.outputs.version }}" \
            --expected-build "${{ steps.label.outputs.build }}" \
            --summary "$RUNNER_TEMP/downloaded_macos_candidate_smoke.json"

  build-windows:
    name: Build Windows developer candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: quality-checks
    env:
      ADOPTIQ_DEVELOPER_ONLY: "1"
      ADOPTIQ_RELEASE_GATE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Update version metadata
        run: python update_version_pc.py
        env:
          ADOPTIQ_VERSION: ${{ env.ADOPTIQ_VERSION }}
          ADOPTIQ_BUILD: ${{ env.ADOPTIQ_BUILD }}

      - name: Assert developer-only Windows build invariant
        shell: pwsh
        run: |
          if ($env:ADOPTIQ_DEVELOPER_ONLY -ne '1') {
            throw "Hosted Windows builds must remain developer-only"
          }
          if ($env:ADOPTIQ_RELEASE_GATE -ne '0') {
            throw "Hosted Windows builds cannot enable the release gate"
          }

      - name: Build developer-only EXE with PyInstaller
        run: python -m PyInstaller --clean --noconfirm adoptiq_pc.spec

      - name: Resolve build label
        id: label
        shell: pwsh
        run: |
          $cfg = Get-Content config.py -Raw
          $version = ($cfg | Select-String -Pattern 'ADOPTIQ_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $build = ($cfg | Select-String -Pattern 'ADOPTIQ_BUILD\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify developer-only Windows candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OUTBOX | Out-Null
          python scripts\verify_windows_developer_candidate.py `
            --exe dist\AdoptIQ.exe `
            --expected-version "${{ steps.label.outputs.version }}" `
            --expected-build "${{ steps.label.outputs.build }}" `
            --expected-commit "$env:GITHUB_SHA" `
            --summary OUTBOX\windows_developer_candidate_verification.json

      - name: Smoke developer-only Windows candidate
        shell: pwsh
        run: |
          python scripts\smoke_frozen_candidate.py `
            --candidate dist\AdoptIQ.exe `
            --expected-version "${{ steps.label.outputs.version }}" `
            --expected-build "${{ steps.label.outputs.build }}" `
            --summary OUTBOX\windows_developer_candidate_smoke.json

      - name: Package OUTBOX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OUTBOX | Out-Null
          Copy-Item dist\AdoptIQ.exe OUTBOX\
          Copy-Item Run_AdoptIQ.bat OUTBOX\
          Copy-Item Unblock_AdoptIQ.bat OUTBOX\
          Copy-Item scripts\win\READ_ME_FIRST.txt OUTBOX\
          $developerReadme = "build\developer-only-payload\windows\README.md"
          if (-not (Test-Path $developerReadme -PathType Leaf)) {
            throw "Generated developer-candidate README is missing"
          }
          Copy-Item $developerReadme OUTBOX\README.md
          "AdoptIQ v${{ steps.label.outputs.version }} build ${{ steps.label.outputs.build }}" | Set-Content OUTBOX\build_info.txt
          "Built: $(Get-Date)" | Add-Content OUTBOX\build_info.txt
          Get-ChildItem -Path OUTBOX -File | Unblock-File -ErrorAction SilentlyContinue

      - name: Stage checksummed Windows developer candidate
        shell: pwsh
        run: |
          python scripts\candidate_provenance.py stage `
            --stage-dir native_candidate_stage\windows `
            --platform windows `
            --version "${{ steps.label.outputs.version }}" `
            --build "${{ steps.label.outputs.build }}" `
            --commit "$env:GITHUB_SHA" `
            --file OUTBOX\AdoptIQ.exe `
            --file OUTBOX\Run_AdoptIQ.bat `
            --file OUTBOX\Unblock_AdoptIQ.bat `
            --file OUTBOX\READ_ME_FIRST.txt `
            --file OUTBOX\README.md `
            --file OUTBOX\build_info.txt `
            --file OUTBOX\windows_developer_candidate_verification.json `
            --file OUTBOX\windows_developer_candidate_smoke.json

      - name: Upload Windows developer candidate
        uses: actions/upload-artifact@v4
        with:
          name: AdoptIQ-Windows-v${{ steps.label.outputs.version }}-build${{ steps.label.outputs.build }}-developer
          path: native_candidate_stage/windows/*
          if-no-files-found: error

      - name: Download uploaded Windows developer candidate
        uses: actions/download-artifact@v4
        with:
          name: AdoptIQ-Windows-v${{ steps.label.outputs.version }}-build${{ steps.label.outputs.build }}-developer
          path: ${{ runner.temp }}/downloaded-windows-candidate

      - name: Re-verify downloaded Windows developer candidate
        shell: pwsh
        run: |
          $downloaded = Join-Path $env:RUNNER_TEMP "downloaded-windows-candidate"
          python scripts\candidate_provenance.py verify `
            --stage-dir "$downloaded" `
            --platform windows `
            --version "${{ steps.label.outputs.version }}" `
            --build "${{ steps.label.outputs.build }}" `
            --commit "$env:GITHUB_SHA"
          python scripts\verify_windows_developer_candidate.py `
            --exe (Join-Path $downloaded "AdoptIQ.exe") `
            --expected-version "${{ steps.label.outputs.version }}" `
            --expected-build "${{ steps.label.outputs.build }}" `
            --expected-commit "$env:GITHUB_SHA" `
            --summary (Join-Path $env:RUNNER_TEMP "downloaded_windows_candidate_verification.json")
          python scripts\smoke_frozen_candidate.py `
            --candidate (Join-Path $downloaded "AdoptIQ.exe") `
            --expected-version "${{ steps.label.outputs.version }}" `
            --expected-build "${{ steps.label.outputs.build }}" `
            --summary (Join-Path $env:RUNNER_TEMP "downloaded_windows_candidate_smoke.json")

  # Round 169.4: PR-only Cloud/Bob gate. Lives in this file because it is the
  # last workflow that received a hosted runner. Packaging jobs above stay
  # workflow_dispatch-only. Fixture-only; honesty stamps stay false.
  offline-sim-pr:
    name: Offline sim (PR profile)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove CI surface exists
        run: python3 scripts/check_offline_sim_ci_surface.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Run Cloud/Bob offline sim (PR profile)
        run: make offline-sim-pr
        env:
          PY: python3
