# Round 168 / Round 169.1: Cloud/Bob offline simulation on every pull request.
# Never claims live Cisco accuracy. Never copies real CSOne into Git.
# A ~3s empty-step failure with no runner_name is a runner-assignment
# problem (read the check-run annotation). It is not a missing make target;
# scripts/check_offline_sim_ci_surface.py proves the surface exists.
name: Offline Bob sim

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sim-pr:
    name: Offline sim (PR profile)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove CI surface exists
        run: python3 scripts/check_offline_sim_ci_surface.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Run Cloud/Bob offline sim (PR profile)
        run: make offline-sim-pr
        env:
          PY: python3
