# Round 169.3: Cloud/Bob offline simulation on every pull request.
# Never claims live Cisco accuracy. Never copies real CSOne into Git.
# Shape matches the last runner-assigned Quality Checks job (2026-08-04):
# ubuntu-latest, actions/checkout@v4, actions/setup-python@v5, Python 3.11.
# A ~2s empty-step failure with runner_id=0 means the job never started —
# diagnose workflow/runner/config. It is not a missing make target.
name: Offline Bob sim

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sim-pr:
    name: Offline sim (PR profile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove CI surface exists
        run: python3 scripts/check_offline_sim_ci_surface.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Run Cloud/Bob offline sim (PR profile)
        run: make offline-sim-pr
        env:
          PY: python3
