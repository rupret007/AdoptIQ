# Round 14 bandit configuration.
# Scope: Python source modules at the repo root + tests/. Build artifacts and
# the bundled-secrets file are excluded explicitly.

exclude_dirs:
  - tests
  - build
  - dist
  - OUTBOX
  - __pycache__
  - .venv
  - venv
  - .git
  # `_bundled_secrets.py` is a generated, gitignored, base64-obfuscated
  # artifact emitted by `embed_credentials.py` for PyInstaller bundles. It
  # is not source code; the literals it contains are just tokenized
  # credentials. The real source of those values is `secrets.env`.
  - _bundled_secrets.py

skips:
  # B101: assert is fine in tests; tests are excluded above anyway.
  - B101
  # B404 / B603 / B607: subprocess usage is limited to build helper scripts
  # (build_mac.sh wrappers, embed_credentials, installer_app). Inspect those
  # manually rather than emitting noise on every call.
  - B404
  - B603
  - B607
  # B311: random.* is used for non-security ordering / sampling. Cryptographic
  # random would be obvious in code review.
  - B311
  # B110 / B112: try-except-pass / continue. Round 13 narrowed the high-risk
  # ones; the remainder are deliberate defensive paths and are documented.
  - B110
  - B112
  # B608: SQL string construction. We use parameterized queries everywhere
  # for user input; the warnings here all fire on f-strings that build
  # SELECT projections (column lists), not WHERE values. Real injection is
  # already caught by the targeted tests in tests/.
  - B608
