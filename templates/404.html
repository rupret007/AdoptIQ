{% extends "base.html" %}

{% block title %}Page Not Found - AdoptIQ{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="mb-5">
                <div class="bg-primary bg-opacity-10 d-inline-flex p-4 rounded-circle mb-4">
                    <i class="fas fa-exclamation-triangle fa-4x text-primary"></i>
                </div>
                <h1 class="display-4 fw-bold text-primary error-code mb-3">404</h1>
                <h2 class="h3 mb-4">Page Not Found</h2>
                <p class="lead text-muted mb-5">
                    The page you're looking for doesn't exist or has been moved.
                </p>
            </div>
            
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-home me-2"></i>Go to Dashboard
                </a>
                <a href="{{ url_for('help') }}" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-question-circle me-2"></i>Get Help
                </a>
            </div>
            
            <div class="mt-5">
                <h5 class="mb-3">Popular Pages</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <a href="{{ url_for('index') }}" class="text-decoration-none">
                            <div class="card h-100 text-center p-3">
                                <i class="fas fa-play text-primary fa-2x mb-2"></i>
                                <h6>Run Analysis</h6>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="{{ url_for('history') }}" class="text-decoration-none">
                            <div class="card h-100 text-center p-3">
                                <i class="fas fa-history text-success fa-2x mb-2"></i>
                                <h6>View History</h6>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="{{ url_for('help') }}" class="text-decoration-none">
                            <div class="card h-100 text-center p-3">
                                <i class="fas fa-question-circle text-info fa-2x mb-2"></i>
                                <h6>Help & Docs</h6>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
