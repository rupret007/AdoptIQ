[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    slow: marks tests that perform file I/O or report generation
    flask: marks tests that use the Flask test client
    eval: Round 66 / Pass 4 - Ask AI golden-set eval; excluded from default
        run because cassettes assume offline replay. Run via `make eval-ask-ai`.
addopts = -v --tb=short -m "not eval"
